# Legal Tracker Triage — schedule configuration
#
# Runs once a week, Saturday at 7:00 AM Eastern — matches the live trigger's
# actual cron (0 11 * * 6, evaluated in UTC). No other Legal Tracker routine
# runs on Saturday (daily-brief and nat-1-1-briefing are weekdays only,
# legal-tracker-triage-review is Tuesday), so no overlap risk regardless of
# exact time-of-day.
# Eastern Standard Time  = UTC-5  →  12:00 UTC
# Eastern Daylight Time  = UTC-4  →  11:00 UTC
# The harness handles DST automatically when timezone is specified — note the
# live trigger itself is a fixed UTC cron (11:00) set via the scheduler API,
# not this file, so it does NOT auto-adjust for DST; it'll drift to 6:00 AM
# Eastern once EST starts unless the trigger's cron is updated separately.
#
# NOTE: placeholder timing — adjust to preference. The 14-day review window
# in prompt.md's Step 1 is sized for this weekly cadence (double the ~7-day
# gap between runs, same safety-margin logic as the old daily version's
# 48-hour window); change both together if the cadence changes.

name: legal-tracker-triage
prompt: routines/legal-tracker-triage/prompt.md
schedule:
  cron: "0 7 * * 6"          # 7:00 AM Eastern, Saturday only — harness applies timezone below
  timezone: America/New_York
